              role: outlined
              include_placeholder: true
              bold: false
              align: full
              placeholder: -- TODOS--
              spacing_above: small
              background: theme:White
              underline: false
              font: ''
              foreground: ''
              items: ['']
              spacing_below: small
              visible: true
              border: ''
              italic: false
              enabled: true
              font_size: null
              tooltip: ''
            name: drop_down_status
            layout_properties: {column: SMZSVD}
            event_bindings: {change: drop_down_status_change}
