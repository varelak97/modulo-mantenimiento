          rows_per_page: 100
          wrap_on: never
          foreground: ''
          show_page_controls: true
          auto_header: true
          spacing_below: small
          visible: true
          border: ''
          tooltip: ''
        name: data_grid_registros
        layout_properties: {grid_position: 'VJGODR,FPUMOI', full_width_row: true}
        components:
        - type: DataRowPanel
          properties: {role: fijar-rowpanel, bold: false, align: left, spacing_above: none, item: null, background: 'theme:Outline', underline: false, font: '', auto_display_data: true, foreground: '', spacing_below: none, visible: true, border: '', italic: false, font_size: null, tooltip: ''}
