            layout_properties: {column: YSYCQI}
            event_bindings: {change: text_box_filtro_area_change}
          - type: TextBox
            properties: {role: outlined, bold: false, align: left, placeholder: '', spacing_above: small, background: 'theme:White', type: text, underline: false, font: '', hide_text: false, foreground: '', spacing_below: small, visible: true, border: '', italic: false, enabled: true, font_size: null, tooltip: '', text: ''}
            name: text_box_filtro_folio
            layout_properties: {column: CKNHIZ}
            event_bindings: {change: text_box_filtro_folio_change}
          - type: DatePicker
            properties: {role: outlined, bold: false, format: '%Y-%m-%d', align: left, date: '', placeholder: '', pick_time: false, spacing_above: small, background: 'theme:White', underline: false, font: '', max_date: '', foreground: '', spacing_below: small, visible: true, border: '', italic: false, enabled: true, font_size: null, tooltip: '', min_date: ''}
            name: date_picker_filtro_fecha_programada
            layout_properties: {column: NZNCXN}
            event_bindings: {change: date_picker_filtro_fecha_programada_change}
          - type: TextBox
            properties: {role: outlined, bold: false, align: left, placeholder: '', spacing_above: small, background: 'theme:White', type: text, underline: false, font: '', hide_text: false, foreground: '', spacing_below: small, visible: true, border: '', italic: false, enabled: true, font_size: null, tooltip: '', text: ''}
