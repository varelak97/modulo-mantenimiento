        - type: Label
          properties: {role: title, bold: true, align: center, spacing_above: small, background: '', icon: '', underline: false, font: '', icon_align: left, foreground: 'theme:LightGray', spacing_below: small, visible: true, border: '', italic: false, font_size: null, tooltip: '', text: NO EXISTEN REGISTROS EN LA BASE DE DATOS}
