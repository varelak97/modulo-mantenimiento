            event_bindings: {change: text_box_filtro_equipo_change}
          - type: Button
            properties: {role: elevated-button, bold: false, align: center, spacing_above: small, background: '', icon: 'fa:eraser', underline: false, font: '', icon_align: left, foreground: '', spacing_below: small, visible: true, border: '', italic: false, enabled: true, font_size: null, tooltip: '', text: ''}
