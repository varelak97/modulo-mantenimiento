container:
  type: ColumnPanel
  properties: {col_widths: '{}'}
components:
- type: ColumnPanel
  properties: {role: null, col_widths: '{}', spacing_above: small, background: '', wrap_on: mobile, col_spacing: medium, foreground: '', spacing_below: small, visible: true, border: '', tooltip: ''}
  name: content_panel
  layout_properties: {grid_position: 'NVRXHZ,JFJVPF', full_width_row: true}
  components:
  - type: ColumnPanel
    properties: {role: elevated-card, col_widths: '{}', spacing_above: small, background: '', wrap_on: mobile, col_spacing: medium, foreground: '', spacing_below: small, visible: true, border: '', tooltip: ''}
    name: outlined_card_title
    layout_properties: {grid_position: 'BMTUJT,EVXHVT'}
    components:
    - type: Label
      properties: {role: title, bold: true, align: center, spacing_above: small, background: 'theme:Primary', icon: '', underline: false, font: '', icon_align: left, foreground: 'theme:On Primary', spacing_below: small, visible: true, border: '', italic: false, font_size: null, tooltip: '', text: SOLICITUD DE MANTENIMIENTO CORRECTIVO Y PREVENTIVO PROGRAMADO}
      name: label_titulo
      layout_properties: {grid_position: 'HLPQRA,LFZMPT'}
  - type: ColumnPanel
    properties: {role: null, col_widths: '{}', spacing_above: small, background: '', wrap_on: mobile, col_spacing: medium, foreground: '', spacing_below: small, visible: true, border: '', tooltip: ''}
    name: column_panel_body
    layout_properties: {grid_position: 'ITMSGI,HIJDEB', full_width_row: true}
    components:
    - name: flow_panel_botones
      properties: {align: center}
      type: FlowPanel
      layout_properties: {grid_position: 'VQAUNK,PCLLSS', full_width_row: false}
      components:
      - type: Button
        properties: {role: elevated-button, bold: true, align: center, spacing_above: small, background: '', icon: 'fa:refresh', underline: false, font: '', icon_align: left, foreground: '', spacing_below: small, visible: true, border: '', italic: false, enabled: true, font_size: null, tooltip: '', text: ACTUALIZAR TABLA}
        name: button_actualizar
        layout_properties: {}
        event_bindings: {click: button_actualizar_click}
      - name: button_nueva_solicitud
        properties: {text: NUEVA SOLICITUD, bold: true, role: filled-button, background: 'theme:Orange', foreground: 'theme:Primary', icon: 'fa:file'}
        type: Button
        layout_properties: {}
        event_bindings: {click: button_nueva_solicitud_click}
    - name: label_pendiente
      properties: {icon: 'fa:clock-o', text: PENDIENTE DE REVISIÓN, bold: true, align: center, background: 'theme:Yellow'}
      type: Label
      layout_properties: {grid_position: 'QGOUBS,VJDTNN'}
    - name: label_realizado
      properties: {text: PENDIENTE DE APROBACIÓN, icon: 'fa:check', bold: true, align: center, background: 'theme:GrayGreen'}
      type: Label
      layout_properties: {grid_position: 'QGOUBS,HSYCYF'}
    - name: label_aprobado
      properties: {bold: true, icon: 'fa:check', text: APROBADO, align: center, background: 'theme:SecondaryGreen'}
      type: Label
      layout_properties: {grid_position: 'QGOUBS,XPDUHA'}
    - type: ColumnPanel
      properties: {role: elevated-card, col_widths: '{}', spacing_above: small, background: '', wrap_on: mobile, col_spacing: medium, foreground: '', spacing_below: small, visible: true, border: '', tooltip: ''}
      name: outlined_card_tabla
      layout_properties: {grid_position: 'UOWEAJ,GWFMCN', full_width_row: true}
      components:
      - name: data_grid_aux
        properties:
          columns:
          - {id: JKSDUP, title: Column 1, data_key: column_1, width: '80'}
          - {id: VJQQOR, title: Column 2, data_key: column_2, width: '300'}
          - {id: OJLQEN, title: Column 3, data_key: column_3, width: '200'}
          - {id: MEPMDT, data_key: column_4, title: Column 4, width: '300'}
          - {id: FDJORY, data_key: column_5, title: Column 5, width: '300'}
          - {id: SFJWFS, data_key: column_6, title: Column 6, width: '150'}
          - {id: JDONYG, data_key: column_7, title: Column 7, width: '880'}
          - {id: UGWUTV, data_key: column_8, title: Column 8, width: '300'}
          - {id: HXRRQW, data_key: column_9, title: Column 9, width: '300'}
          auto_header: false
          show_page_controls: false
          role: scroll-data-grid
          visible: true
          spacing_below: none
          spacing_above: none
        type: DataGrid
        components:
        - name: repeating_panel_aux
          properties: {item_template: MANTENIMIENTO_PREVENTIVO_CORRECTIVO_SOLICITUDES_REGISTROS.RowTemplate10, visible: true}
          type: RepeatingPanel
          layout_properties: {}
        layout_properties: {grid_position: 'BSEYJP,EYVCEH', full_width_row: true}
