        properties:
          role: wide-tonal-data-grid
          spacing_above: small
          columns:
          - {id: XMXXEM, title: '', data_key: id, $$hashKey: 'object:234583', width: '80'}
          - {id: CRDPPG, data_key: column_1, title: FOTOS, width: '80'}
          - {id: SMZSVD, title: STATUS, data_key: mtto_realizado, $$hashKey: 'object:234128', width: '150'}
          - {id: CKNHIZ, title: FOLIO, data_key: folio, $$hashKey: 'object:234087', width: '300'}
          - {id: NZNCXN, title: FECHA PROGRAMADA, data_key: fecha_programada, $$hashKey: 'object:28465', width: '200'}
          - {id: YSYCQI, title: AREA, data_key: area, $$hashKey: 'object:234088', width: '300'}
          - {id: YCKOVR, title: EQUIPO, data_key: equipo, $$hashKey: 'object:234089', width: '300'}
          - {id: PWKCNJ, title: FECHA DE REPORTE DE ANOMALÍA, data_key: fecha_reporte, $$hashKey: 'object:234238', width: '200'}
          - {id: DILUZT, title: DESCRIPCIÓN DE LA ANOMALÍA, data_key: descripcion_anomalia, $$hashKey: 'object:234242', width: '300'}
