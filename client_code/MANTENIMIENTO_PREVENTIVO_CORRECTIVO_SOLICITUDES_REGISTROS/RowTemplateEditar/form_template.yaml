container:
  type: DataRowPanel
  data_bindings:
  - {property: tag, code: 'self.item[''id_solicitud_mtto'']'}
components:
- type: Button
  properties: {role: elevated-button, align: center, tooltip: '', border: '', enabled: true,
    foreground: '', visible: true, text: '', font_size: null, font: '', spacing_above: small,
    icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
    underline: false, icon: 'fa:pencil'}
  name: button_editar
  layout_properties: {column: XMXXEM}
  data_bindings:
  - {property: visible, code: 'not bool(int(self.item[''mtto_realizado'']))'}
  event_bindings: {click: button_editar_click}
- type: Label
  properties: {}
  name: label_folio
  layout_properties: {column: CKNHIZ}
  data_bindings:
  - {property: text, code: 'self.item[''folio'']'}
- type: Label
  properties: {}
  name: label_area
  layout_properties: {column: YSYCQI}
  data_bindings:
  - {property: text, code: 'self.item[''area'']'}
- type: Label
  properties: {}
  name: label_equipo
  layout_properties: {column: YCKOVR}
  data_bindings:
  - {property: text, code: 'self.item[''equipo'']'}
- type: Label
  properties: {}
  name: label_fecha_reporte
  layout_properties: {column: PWKCNJ}
  data_bindings:
  - {property: text, code: 'self.item[''fecha_reporte'']'}
- type: Label
  properties: {}
  name: label_descripcion_anomalia
  layout_properties: {column: DILUZT}
  data_bindings:
  - {property: text, code: 'self.item[''descripcion_anomalia'']'}
- type: Label
  properties: {}
  name: label_nombre_persona_reporta
  layout_properties: {column: JXBYZX}
  data_bindings:
  - {property: text, code: 'self.item[''persona_reporta'']'}
- type: CheckBox
  properties: {role: null, align: center, tooltip: '', border: '', enabled: false,
    foreground: '', allow_indeterminate: false, visible: true, text: '', font_size: null,
    font: '', spacing_above: small, spacing_below: small, italic: false, background: '',
    bold: false, checked: false, underline: false}
  name: check_box_status
  layout_properties: {column: SMZSVD}
  data_bindings:
  - {property: checked, code: 'bool(int(self.item[''mtto_realizado'']))', writeback: false}
- type: Label
  properties: {}
  name: label_fecha_programada
  layout_properties: {column: NZNCXN}
  data_bindings:
  - {property: text, code: 'self.item[''fecha_programada'']'}
is_package: true
