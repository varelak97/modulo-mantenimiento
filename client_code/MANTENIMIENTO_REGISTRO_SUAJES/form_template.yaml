container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'JRROUD,TIXQHN', full_width_row: true}
  components:
  - name: outlined_card_title
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'BSTLHB,GZSADJ', full_width_row: true}
    components:
    - name: label_title
      properties: {text: REGISTRO DE SUAJES, bold: true, align: center, role: title, background: 'theme:Primary', foreground: 'theme:On Primary'}
      type: Label
      layout_properties: {grid_position: 'KFNLWK,BZIAEK'}
  - name: outlined_card_body
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'NCEMPF,OFJLPD', full_width_row: true}
    components:
    - name: button_registrar
      properties: {text: REGISTRAR, role: filled-button, bold: true, icon: 'fa:pencil', background: 'theme:Green'}
      type: Button
      layout_properties: {grid_position: 'ONGAYX,RVBZXQ'}
      event_bindings: {click: button_registrar_click}
    - name: button_actualizar
      properties: {text: ACTUALIZAR, icon: 'fa:refresh', bold: true, background: 'theme:Primary', foreground: 'theme:On Primary'}
      type: Button
      layout_properties: {grid_position: 'ONGAYX,AHMNNA'}
      event_bindings: {click: button_actualizar_click}
    - name: data_grid_registros
      properties:
        columns:
        - {id: JKSDUP, title: '', data_key: editar, width: '100'}
        - {id: VJQQOR, title: FECHA PROGRAMADA, data_key: fecha_programada, width: '200'}
        - {id: OJLQEN, title: NÚMERO DE PARTE, data_key: numero_parte, width: '250'}
        - {id: TQAONH, data_key: tipo_suaje, title: TIPO DE SUAJE, width: '250'}
        - {id: NLQEOC, data_key: suajes_programados, title: SUAJES PROGRAMADOS, width: '250'}
        - {id: OAPQCV, data_key: codigo_herramental, title: HERRAMENTAL, width: '200'}
        - {id: ISZKHV, data_key: status, title: STATUS, width: '250'}
        - {id: YOCKTR, data_key: nombre_usuario, title: USUARIO REGISTRADOR, width: '300'}
        role: wide-tonal-data-grid
      type: DataGrid
      components:
      - name: repeating_panel_registros
        properties: {item_template: MANTENIMIENTO_REGISTRO_SUAJES.RowTemplateRegistroHerramental}
        type: RepeatingPanel
      layout_properties: {grid_position: 'ZSKAXC,OUOYWN', full_width_row: true}
is_package: true
