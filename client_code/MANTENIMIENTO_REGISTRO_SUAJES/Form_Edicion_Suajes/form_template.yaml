components:
- components:
  - components:
    - layout_properties: {grid_position: 'MYBAEX,NOPEOI'}
      name: label_titulo
      properties: {align: center, bold: true, role: title, text: PROGRAMACIÓN DE SUAJE}
      type: Label
    - layout_properties: {grid_position: 'BMZTLK,MTDLOA'}
      name: label_fecha_programada
      properties: {bold: true, text: 'FECHA PROGRAMADA:'}
      type: Label
    - data_bindings:
      - {code: '"fecha_programada"', property: tag, writeback: false}
      event_bindings: {change: date_picker_fecha_programada_change}
      layout_properties: {grid_position: 'XAJUYK,PCGCJV'}
      name: date_picker_fecha_programada
      properties: {format: '%d-%m-%Y', role: outlined}
      type: DatePicker
    - layout_properties: {grid_position: 'TTBDUV,MPFDTE'}
      name: label_cliente
      properties: {bold: true, text: 'CLIENTE:'}
      type: Label
    - data_bindings:
      - {code: '"id_cliente"', property: tag, writeback: false}
      event_bindings: {change: drop_down_cliente_change}
      layout_properties: {grid_position: 'SFPREM,XZROLD'}
      name: drop_down_cliente
      properties: {include_placeholder: true, placeholder: -- SELECCIONE --, role: outlined}
      type: DropDown
    - layout_properties: {grid_position: 'BNOSLV,XMWUTL'}
      name: label_numero_parte
      properties: {bold: true, text: 'NÚMERO DE PARTE:'}
      type: Label
    - data_bindings:
      - {code: '"id_numero_parte"', property: tag, writeback: false}
      event_bindings: {change: drop_down_numeros_parte_change}
      layout_properties: {grid_position: 'XBNBYZ,LROIGW'}
      name: drop_down_numeros_parte
      properties: {include_placeholder: true, placeholder: -- SELECCIONE --, role: outlined}
      type: DropDown
    - layout_properties: {grid_position: 'ASNMUD,CIHRRE'}
      name: label_tipo_suaje
      properties: {bold: true, text: 'TIPO DE SUAJE:'}
      type: Label
    - data_bindings:
      - {code: '"tipo_suaje"', property: tag, writeback: false}
      event_bindings: {change: drop_down_tipo_suaje_change}
      layout_properties: {grid_position: 'RRZOMZ,PJDDXL'}
      name: drop_down_tipo_suaje
      properties: {enabled: false, include_placeholder: true, placeholder: -- SELECCIONE --, role: outlined}
      type: DropDown
    - layout_properties: {grid_position: 'UOKLNV,WRGQFC'}
      name: label_suajes_programados
      properties: {bold: true, text: 'SUAJES PROGRAMADOS:'}
      type: Label
    - data_bindings:
      - {code: '"suajes_programados"', property: tag, writeback: false}
      event_bindings: {change: text_box_suajes_programados_change}
      layout_properties: {grid_position: 'KBVVXK,OCUDXN'}
      name: text_box_suajes_programados
      properties: {role: outlined, type: number}
      type: TextBox
    - event_bindings: {click: button_guardar_click}
      layout_properties: {grid_position: 'JKSGPX,CMTCZV'}
      name: button_guardar
      properties: {bold: true, icon: 'fa:save', role: filled-button, text: GUARDAR}
      type: Button
    layout_properties: {grid_position: 'KZNTOV,YXPWYP'}
    name: outlined_card_body
    properties: {role: elevated-card}
    type: ColumnPanel
  layout_properties: {grid_position: 'BIQIDX,HYBYOQ'}
  name: content_panel
  properties: {}
  type: ColumnPanel
container: {type: ColumnPanel}
is_package: true
