container:
  type: ColumnPanel
  properties: {col_widths: '{}'}
components:
- type: ColumnPanel
  properties: {role: null, tooltip: '', border: '', foreground: '', visible: true,
    wrap_on: mobile, col_spacing: medium, spacing_above: small, col_widths: '{}',
    spacing_below: small, background: ''}
  name: content_panel
  layout_properties: {grid_position: 'ECVBDS,BOMQWQ', full_width_row: true}
  components:
  - type: ColumnPanel
    properties: {role: elevated-card, tooltip: '', border: '', foreground: '', visible: true,
      wrap_on: mobile, col_spacing: medium, spacing_above: small, col_widths: '{"TSSTZO":50}',
      spacing_below: small, background: ''}
    name: outlined_card_titulo
    layout_properties: {grid_position: 'OVMKKX,UEWGQB'}
    components:
    - type: Label
      properties: {role: headline, align: center, tooltip: '', border: '', foreground: 'theme:On
          Secondary', visible: true, text: MANTENIMIENTO PREVENTIVO, font_size: null,
        font: '', spacing_above: small, icon_align: left, spacing_below: small, italic: false,
        background: 'theme:Primary', bold: true, underline: false, icon: ''}
      name: label_titulo
      layout_properties: {grid_position: 'HJRILU,TSSTZO'}
  - type: ColumnPanel
    properties: {role: null, tooltip: '', border: '', foreground: '', visible: true,
      wrap_on: mobile, col_spacing: medium, spacing_above: small, col_widths: '{}',
      spacing_below: small, background: ''}
    name: column_panel_body
    layout_properties: {grid_position: 'ZZZRIC,RRNYAS', full_width_row: true}
    components:
    - type: Button
      properties: {role: elevated-button, align: center, tooltip: '', border: '',
        enabled: true, foreground: 'theme:On Primary', visible: true, text: PROGRAMAR MANTENIMIENTOS,
        font_size: null, font: '', spacing_above: small, icon_align: left, spacing_below: small,
        italic: false, background: 'theme:Blue', bold: true, underline: false, icon: 'fa:calendar'}
      name: button_programar
      layout_properties: {grid_position: 'JBGUCX,MDVRMJ'}
      event_bindings: {click: button_programar_click}
    - type: ColumnPanel
      properties: {role: elevated-card, tooltip: '', border: '', foreground: '', visible: true,
        wrap_on: mobile, col_spacing: medium, spacing_above: small, col_widths: '{}',
        spacing_below: small, background: ''}
      name: outlined_card_tabla
      layout_properties: {grid_position: 'QEBOFF,LXAKFN', full_width_row: true}
      components:
      - name: column_panel_1
        properties: {col_widths: '{"OXZIRT":15,"AISDPL":25,"UAWLUQ":20}'}
        type: ColumnPanel
        layout_properties: {grid_position: 'VBNZHO,EKMQZA', full_width_row: true}
        components:
        - name: label_numero_registros
          properties: {text: 'Registros:', bold: true, foreground: 'theme:Primary',
            align: left}
          type: Label
          layout_properties: {grid_position: 'FDLETN,OXZIRT', full_width_row: true}
        - type: Button
          properties: {role: elevated-button, align: left, tooltip: '', border: '',
            enabled: true, foreground: '', visible: true, text: ACTUALIZAR TABLA,
            font_size: null, font: '', spacing_above: small, icon_align: left, spacing_below: small,
            italic: false, background: '', bold: true, underline: false, icon: 'fa:refresh'}
          name: button_actualizar
          layout_properties: {grid_position: 'FDLETN,UAWLUQ'}
          event_bindings: {click: button_actualizar_click}
      - type: DataGrid
        properties:
          role: wide-tonal-data-grid
          columns:
          - {id: IZLTZI, title: '', data_key: editar, $$hashKey: 'object:2618', width: '80'}
          - {id: YWSDJV, title: FECHA PROGRAMADA, data_key: fecha_programada, $$hashKey: 'object:2574',
            width: '250'}
          - {id: JEOEIG, title: AREA, data_key: area, $$hashKey: 'object:2575', width: '350'}
          - {id: KAQTHB, title: EQUIPO, data_key: equipo, $$hashKey: 'object:2576',
            width: ''}
          - {id: BELBDL, title: FRECUENCIA, data_key: frecuecia, $$hashKey: 'object:2614',
            width: '200'}
          - {id: CJCQWT, title: STATUS, data_key: status_mantenimiento, $$hashKey: 'object:2616',
            width: '200'}
          auto_header: true
          tooltip: ''
          border: ''
          foreground: ''
          rows_per_page: 100
          visible: true
          wrap_on: never
          show_page_controls: true
          spacing_above: small
          spacing_below: small
          background: ''
        name: data_grid_registros
        layout_properties: {grid_position: 'BULTXY,XUBQAN', full_width_row: true}
        components:
        - type: DataRowPanel
          properties: {role: null, align: left, tooltip: '', border: '', foreground: '',
            auto_display_data: true, visible: true, item: null, font_size: null, font: '',
            spacing_above: none, spacing_below: none, italic: false, background: 'theme:Outline',
            bold: false, underline: false}
          name: data_row_panel_filtros
          layout_properties: {pinned: true}
          components:
          - type: Button
            properties: {role: elevated-button, align: center, tooltip: '', border: '',
              enabled: true, foreground: '', visible: true, text: '', font_size: null,
              font: '', spacing_above: small, icon_align: left, spacing_below: small,
              italic: false, background: '', bold: false, underline: false, icon: 'fa:eraser'}
            name: button_borrar_filtros
            layout_properties: {column: IZLTZI}
            event_bindings: {click: button_borrar_filtros_click}
          - type: TextBox
            properties: {role: null, align: left, hide_text: false, tooltip: '', placeholder: '',
              border: '', enabled: true, foreground: '', visible: true, text: '',
              font_size: null, font: '', spacing_above: small, type: text, spacing_below: small,
              italic: false, background: 'theme:White', bold: false, underline: false}
            name: text_box_filtro_equipo
            layout_properties: {column: KAQTHB}
            event_bindings: {change: text_box_filtro_equipo_change}
          - type: DropDown
            properties:
              role: null
              align: full
              tooltip: ''
              placeholder: -- TODOS --
              border: ''
              enabled: true
              foreground: ''
              items: [SEMANAL, MENSUAL, TRIMESTRAL, SEMESTRAL, ANUAL]
              visible: true
              font_size: null
              font: ''
              spacing_above: small
              spacing_below: small
              italic: false
              background: theme:White
              bold: false
              underline: false
              include_placeholder: true
            name: drop_down_filtro_frecuencia
            layout_properties: {column: BELBDL}
            event_bindings: {change: drop_down_filtro_frecuencia_change}
          - type: TextBox
            properties: {role: null, align: left, hide_text: false, tooltip: '', placeholder: '',
              border: '', enabled: true, foreground: '', visible: true, text: '',
              font_size: null, font: '', spacing_above: small, type: text, spacing_below: small,
              italic: false, background: 'theme:White', bold: false, underline: false}
            name: text_box_filtro_area
            layout_properties: {column: JEOEIG}
            event_bindings: {change: text_box_filtro_area_change}
          - name: column_panel_filtro_fechas
            properties: {col_widths: '{"FPQSVV":40,"CCFHFN":40,"CJYLZQ":20,"PRFLIU":15,"VICVIB":45}'}
            type: ColumnPanel
            layout_properties: {column: YWSDJV}
            components:
            - type: DatePicker
              properties: {role: null, align: left, max_date: '', pick_time: false,
                tooltip: '', placeholder: '', border: '', enabled: true, foreground: '',
                visible: false, font_size: null, font: '', spacing_above: small, spacing_below: small,
                italic: false, date: '', min_date: '', background: 'theme:White',
                bold: false, underline: false, format: '%Y-%m-%d'}
              name: date_picker_filtro_fecha_programada
              layout_properties: {grid_position: 'HYOJVX,CCFHFN GFJPWK,FPQSVV'}
              event_bindings: {change: date_picker_filtro_fecha_programada_change}
            - name: button_change
              properties: {text: '', icon: 'fa:exchange', role: filled-button, background: 'theme:Orange'}
              type: Button
              layout_properties: {grid_position: 'HYOJVX,CJYLZQ'}
              event_bindings: {click: button_change_click}
            - name: drop_down_filtro_meses
              properties:
                items: ['']
                role: outlined
                foreground: ''
                background: theme:On Primary
                include_placeholder: true
                placeholder: -- MES --
                visible: true
              type: DropDown
              layout_properties: {grid_position: 'HYOJVX,CCFHFN MNALRT,VICVIB'}
              event_bindings: {change: drop_down_filtro_meses_change}
          - name: drop_down_filtro_status
            properties:
              role: outlined
              background: theme:On Primary
              items: [PROGRAMADO, REALIZADO, REPROGRAMADO, ATRASADO]
              include_placeholder: true
              placeholder: -- TODOS --
            type: DropDown
            layout_properties: {column: CJCQWT}
            event_bindings: {change: drop_down_filtro_status_change}
        - type: RepeatingPanel
          properties: {spacing_above: none, spacing_below: none, item_template: MANTENIMIENTO_PREVENTIVO_REGISTROS.RowTemplateEditar}
          name: repeating_panel_registros
          layout_properties: {}
      - type: ColumnPanel
        properties: {role: null, tooltip: '', border: '', foreground: '', visible: false,
          wrap_on: mobile, col_spacing: medium, spacing_above: small, col_widths: '{}',
          spacing_below: small, background: ''}
        name: column_panel_empty_db
        layout_properties:
          col_widths: {}
          grid_position: MVMCBO,EQDSLN
        components:
        - type: Spacer
          properties: {height: 106}
          name: spacer_1
          layout_properties: {grid_position: 'ANDJFI,KWFJNI'}
        - type: Label
          properties: {role: title, align: center, tooltip: '', border: '', foreground: 'theme:LightGray',
            visible: true, text: NO EXISTEN REGISTROS EN LA BASE DE DATOS, font_size: null,
            font: '', spacing_above: small, icon_align: left, spacing_below: small,
            italic: false, background: '', bold: true, underline: false, icon: ''}
          name: label_db_empty
          layout_properties: {grid_position: 'WXAJZT,DYKTVM'}
        - type: Spacer
          properties: {height: 104}
          name: spacer_2
          layout_properties: {grid_position: 'MTGVRN,WARUQB'}
is_package: true
