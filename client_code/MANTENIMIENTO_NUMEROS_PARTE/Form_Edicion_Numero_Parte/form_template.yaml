components:
- components:
  - components:
    - layout_properties: {grid_position: 'YJZBXB,LQITGE'}
      name: label_titulo
      properties: {align: center, bold: true, role: title, text: REGISTRO DE NÚMERO DE PARTE}
      type: Label
    - layout_properties: {grid_position: 'JHYVJM,ZHCBDY DLNMGV,OGXBTN'}
      name: label_fecha_registro
      properties: {bold: true, text: 'FECHA DE REGISTRO:'}
      type: Label
    - data_bindings:
      - {code: '"fecha_registro"', property: tag, writeback: false}
      event_bindings: {change: date_picker_fecha_registro_change}
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY RRTUHC,ECFLSF'}
      name: date_picker_fecha_registro
      properties: {format: '%d-%m-%Y', role: outlined}
      type: DatePicker
    - layout_properties: {grid_position: 'JHYVJM,ZHCBDY JCFXBY,OLURNU'}
      name: label_numero_parte
      properties: {bold: true, text: 'NÚMERO DE PARTE:'}
      type: Label
    - data_bindings:
      - {code: '"numero_parte"', property: tag, writeback: false}
      event_bindings: {change: text_box_numero_parte_change}
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY KYQRYX,MYTCED'}
      name: text_box_numero_parte
      properties: {role: outlined}
      type: TextBox
    - layout_properties: {grid_position: 'JHYVJM,ZHCBDY QSWLQB,HFRWXT'}
      name: label_cliente
      properties: {bold: true, text: 'CLIENTE:'}
      type: Label
    - data_bindings:
      - {code: '"id_cliente"', property: tag, writeback: false}
      event_bindings: {change: drop_down_cliente_change}
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY LTHYAD,AQOQUY'}
      name: drop_down_cliente
      properties: {include_placeholder: true, placeholder: -- SELECCIONE --, role: outlined}
      type: DropDown
    - layout_properties: {grid_position: 'JHYVJM,ZHCBDY QFVGLJ,ZXKKHS'}
      name: label_descripcion
      properties: {bold: true, text: 'DESCRIPCIÓN:'}
      type: Label
    - data_bindings:
      - {code: '"comentarios"', property: tag, writeback: false}
      event_bindings: {change: text_area_descripcion_change}
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY VSKUBH,SAQXCN'}
      name: text_area_descripcion
      properties: {height: 106, role: outlined}
      type: TextArea
    - layout_properties: {grid_position: 'JHYVJM,DTVAFF NNBUGC,ZDYUQI'}
      name: label_suajes_asociados
      properties: {align: center, background: '', bold: true, foreground: '', text: SUAJES ASOCIADOS}
      type: Label
    - components:
      - data_bindings:
        - {code: '"id_herramentales"', property: tag, writeback: false}
        layout_properties: {}
        name: repeating_panel_suajes_asociados
        properties: {background: '', foreground: '', item_template: MANTENIMIENTO_NUMEROS_PARTE.Form_Edicion_Numero_Parte.RowTemplate13, role: null}
        type: RepeatingPanel
      layout_properties: {grid_position: 'JHYVJM,DTVAFF YIRQNS,SHLKTJ'}
      name: data_grid_suajes_asociados
      properties:
        columns:
        - {data_key: column_2, id: VJQQOR, title: '', width: '80'}
        - {data_key: codigo_herramental, id: JKSDUP, title: CÓDIGO HERRAMENTAL, width: '250'}
        - {data_key: tipo_suaje, id: OJLQEN, title: TIPO SUAJE, width: '200'}
        show_page_controls: false
      type: DataGrid
    - event_bindings: {click: button_agregar_click}
      layout_properties: {grid_position: 'JHYVJM,DTVAFF ZMREST,LBQQMR'}
      name: button_agregar
      properties: {background: 'theme:Green', bold: true, font_size: null, icon: 'fa:plus-circle', role: filled-button, text: ''}
      type: Button
    - layout_properties: {grid_position: 'JHYVJM,DTVAFF COIFLE,SKIXHH'}
      name: spacer_1
      properties: {height: 29}
      type: Spacer
    - event_bindings: {click: button_guardar_click}
      layout_properties: {grid_position: 'JHYVJM,DTVAFF OHGCMD,IXKWTC'}
      name: button_guardar
      properties: {bold: true, icon: 'fa:save', role: filled-button, text: GUARDAR}
      type: Button
    layout_properties: {grid_position: 'XCJVFR,ZOIPCL'}
    name: column_panel_body
    properties: {col_widths: '{"ZHCBDY":25,"DTVAFF":35}', role: elevated-card}
    type: ColumnPanel
  layout_properties: {grid_position: 'FBMSWL,ADQTAS'}
  name: content_panel
  properties: {}
  type: ColumnPanel
container: {type: ColumnPanel}
is_package: true
