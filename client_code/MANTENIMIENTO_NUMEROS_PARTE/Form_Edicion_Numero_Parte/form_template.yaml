container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'FBMSWL,ADQTAS'}
  components:
  - name: column_panel_body
    properties: {role: elevated-card, col_widths: '{"ZHCBDY":25,"DTVAFF":35}'}
    type: ColumnPanel
    layout_properties: {grid_position: 'XCJVFR,ZOIPCL'}
    components:
    - name: label_titulo
      properties: {text: REGISTRO DE NÚMERO DE PARTE, role: title, align: center, bold: true}
      type: Label
      layout_properties: {grid_position: 'YJZBXB,LQITGE'}
    - name: label_fecha_registro
      properties: {text: 'FECHA DE REGISTRO:', bold: true}
      type: Label
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY DLNMGV,OGXBTN'}
    - name: date_picker_fecha_registro
      properties: {role: outlined, format: '%d-%m-%Y'}
      type: DatePicker
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY RRTUHC,ECFLSF'}
      data_bindings:
      - {property: tag, code: '"fecha_registro"', writeback: false}
    - name: label_numero_parte
      properties: {text: 'NÚMERO DE PARTE:', bold: true}
      type: Label
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY JCFXBY,OLURNU'}
    - name: text_box_numero_parte
      properties: {role: outlined}
      type: TextBox
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY KYQRYX,MYTCED'}
      data_bindings:
      - {property: tag, code: '"numero_parte"', writeback: false}
    - name: label_cliente
      properties: {text: 'CLIENTE:', bold: true}
      type: Label
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY QSWLQB,HFRWXT'}
    - name: drop_down_cliente
      properties: {role: outlined, include_placeholder: true, placeholder: -- SELECCIONE --}
      type: DropDown
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY LTHYAD,AQOQUY'}
      data_bindings:
      - {property: tag, code: '"cliente"', writeback: false}
    - name: label_descripcion
      properties: {text: 'DESCRIPCIÓN:', bold: true}
      type: Label
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY QFVGLJ,ZXKKHS'}
    - name: text_area_descripcion
      properties: {height: 106, role: outlined}
      type: TextArea
      layout_properties: {grid_position: 'JHYVJM,ZHCBDY VSKUBH,SAQXCN'}
      data_bindings:
      - {property: tag, code: '"comentarios"', writeback: false}
    - name: label_suajes_asociados
      properties: {text: SUAJES ASOCIADOS, bold: true, align: center, background: '', foreground: ''}
      type: Label
      layout_properties: {grid_position: 'JHYVJM,DTVAFF NNBUGC,ZDYUQI'}
    - name: data_grid_suajes_asociados
      properties:
        columns:
        - {id: VJQQOR, title: '', data_key: column_2, width: '80'}
        - {id: JKSDUP, title: CÓDIGO HERRAMENTAL, data_key: codigo_herramental, width: '250'}
        - {id: OJLQEN, title: TIPO SUAJE, data_key: tipo_suaje, width: '200'}
        show_page_controls: false
      type: DataGrid
      components:
      - name: repeating_panel_suajes_asociados
        properties: {item_template: MANTENIMIENTO_NUMEROS_PARTE.Form_Edicion_Numero_Parte.RowTemplate13}
        type: RepeatingPanel
        data_bindings:
        - {property: tag, code: '"id_herramentales"', writeback: false}
      layout_properties: {grid_position: 'JHYVJM,DTVAFF YIRQNS,SHLKTJ'}
    - name: button_agregar
      properties: {text: '', icon: 'fa:plus-circle', role: filled-button, bold: true, background: 'theme:Green', font_size: null}
      type: Button
      layout_properties: {grid_position: 'JHYVJM,DTVAFF ZMREST,LBQQMR'}
      event_bindings: {click: button_agregar_click}
    - name: spacer_1
      properties: {height: 29}
      type: Spacer
      layout_properties: {grid_position: 'JHYVJM,DTVAFF COIFLE,SKIXHH'}
    - name: button_guardar
      properties: {text: GUARDAR, role: filled-button, icon: 'fa:save', bold: true}
      type: Button
      layout_properties: {grid_position: 'JHYVJM,DTVAFF OHGCMD,IXKWTC'}
      event_bindings: {click: button_guardar_click}
is_package: true
