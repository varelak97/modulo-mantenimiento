container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'IQUIRM,TZUPQX', full_width_row: true}
  components:
  - name: column_panel_title
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'LIZXIK,CVBRNQ'}
    components:
    - name: label_title
      properties: {text: NÚMEROS DE PARTE, role: title, background: 'theme:Primary', foreground: 'theme:On Primary', align: center, bold: true}
      type: Label
      layout_properties: {grid_position: 'GLAZYC,EHHOFV'}
  - name: column_panel_body
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'EPEXKE,JCCMIX', full_width_row: true}
    components:
    - name: flow_panel_opciones
      properties: {align: center}
      type: FlowPanel
      layout_properties: {grid_position: 'DPTSHE,ATMWXN'}
      components:
      - name: button_nuevo_numero_parte
        properties: {text: NUEVO NÚMERO DE PARTE, role: filled-button, icon: 'fa:file', bold: true, background: 'theme:Orange', foreground: 'theme:Primary'}
        type: Button
        event_bindings: {click: button_nuevo_numero_parte_click}
      - name: button_actualizar
        properties: {text: ACTUALIZAR, role: filled-button, icon: 'fa:refresh', bold: true}
        type: Button
        event_bindings: {click: button_actualizar_click}
    - name: data_grid_numeros_parte
      properties:
        columns:
        - {id: JKSDUP, title: '', data_key: editar, width: '100'}
        - {id: OJLQEN, title: CLIENTE, data_key: cliente, width: '300'}
        - {id: VJQQOR, title: NÚMERO DE PARTE, data_key: numero_parte, width: '250'}
        - {id: OCXQLW, data_key: herramentales, title: SUAJES, width: '250'}
        - {id: BYEKWX, data_key: fecha_registro, title: FECHA DE REGISTRO, width: '200'}
        - {id: HRTTQR, data_key: comentarios, title: COMENTARIOS, width: '400'}
        - {id: JVRGIU, data_key: usuario_registrador, title: USUARIO QUE REGISTRA, width: '400'}
        role: wide-tonal-data-grid
        rows_per_page: 100
      type: DataGrid
      components:
      - name: data_row_panel_1
        properties: {background: 'theme:Secondary'}
        type: DataRowPanel
        layout_properties: {}
        components:
        - name: text_box_filtro_numero_parte
          properties: {role: outlined, background: 'theme:On Primary'}
          type: TextBox
          layout_properties: {column: VJQQOR}
        - name: text_box_filtro_cliente
          properties: {role: outlined, background: 'theme:On Primary'}
          type: TextBox
          layout_properties: {column: OJLQEN}
        - name: text_box_suajes
          properties: {role: outlined, background: 'theme:On Primary'}
          type: TextBox
          layout_properties: {column: OCXQLW}
      - name: repeating_panel_numeros_parte
        properties: {item_template: MANTENIMIENTO_NUMEROS_PARTE.RowTemplate12}
        type: RepeatingPanel
      layout_properties: {grid_position: 'HVAMQF,GLJDZI', full_width_row: true}
is_package: true
