components:
- layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- components:
  - data_bindings:
    - {code: 'f"{self.datos[''nombre_usuario'']} ({self.datos[''id_usuario_erp'']})"', property: text, writeback: false}
    layout_properties: {}
    name: label_usuario
    properties: {role: input-prompt}
    type: Label
  - event_bindings: {click: link_cerrar_sesion_click}
    layout_properties: {}
    name: link_cerrar_sesion
    properties: {background: '', icon: 'fa:sign-out', icon_align: right, role: body, text: CERRAR SESIÓN}
    type: Link
  layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- components:
  - data_bindings: []
    event_bindings: {click: link_mantenimiento_click}
    layout_properties: {grid_position: 'SQBIOU,YLAWNP'}
    name: link_mantenimiento
    properties: {bold: true, icon: 'fa:wrench', text: MANTENIMIENTO}
    type: Link
  - event_bindings: {click: link_sistemas_click}
    layout_properties: {grid_position: 'BTJJJC,ZUSTPO'}
    name: link_sistemas
    properties: {bold: true, icon: 'fa:desktop', text: SISTEMAS}
    type: Link
  - data_bindings: []
    event_bindings: {click: link_herramentales_click}
    layout_properties: {grid_position: 'WNSACP,UMYSVC'}
    name: link_herramentales
    properties: {bold: true, icon: 'fa:cog', text: HERRAMENTALES}
    type: Link
  layout_properties: {slot: left-nav}
  name: column_panel_1
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: title}
  name: label_1
  properties: {text: MANTENIMIENTO}
  type: Label
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
