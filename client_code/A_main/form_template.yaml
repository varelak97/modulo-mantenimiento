is_package: true
container:
  type: HtmlTemplate
  properties: {html: '@theme:standard-page.html'}
components:
- type: ColumnPanel
  properties: {}
  name: content_panel
  layout_properties: {slot: default}
- type: FlowPanel
  properties: {}
  name: navbar_links
  layout_properties: {slot: nav-right}
  components:
  - name: label_usuario
    properties: {role: input-prompt}
    type: Label
    layout_properties: {}
    data_bindings:
    - {property: text, code: 'f"{self.datos[''nombre_usuario'']} ({self.datos[''id_usuario_erp'']})"',
      writeback: false}
  - name: link_cerrar_sesion
    properties: {role: body, text: CERRAR SESIÓN, icon: 'fa:sign-out', background: '',
      icon_align: right}
    type: Link
    layout_properties: {}
    event_bindings: {click: link_cerrar_sesion_click}
- name: column_panel_1
  properties: {}
  type: ColumnPanel
  layout_properties: {slot: left-nav}
  components:
  - name: link_config
    properties: {icon: 'fa:cogs', text: AJUSTES, bold: true}
    type: Link
    layout_properties: {grid_position: 'NFOIHS,SXGEAG'}
    data_bindings:
    - {property: visible, code: 'True if self.datos[''id_usuario_erp''] == 58 else
        False', writeback: false}
- name: label_1
  properties: {text: MANTENIMIENTO}
  type: Label
  layout_properties: {slot: title}
