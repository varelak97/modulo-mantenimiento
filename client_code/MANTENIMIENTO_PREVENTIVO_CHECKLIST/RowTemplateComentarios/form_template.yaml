is_package: true
container: {type: DataRowPanel}
components:
- name: label_index
  properties: {align: center, bold: true}
  type: Label
  layout_properties: {column: JKSDUP}
  data_bindings:
  - {property: text, code: 'self.item[''index'']', writeback: false}
- name: label_comentario
  properties: {}
  type: Label
  layout_properties: {column: VJQQOR}
  data_bindings:
  - {property: text, code: 'self.item[''comentario'']', writeback: false}
- name: button_editar
  properties: {text: '', icon: 'fa:pencil', role: filled-button, background: 'theme:Green',
    foreground: 'theme:White'}
  type: Button
  layout_properties: {column: HRNGNU}
  event_bindings: {click: button_editar_click}
- name: column_panel_comentario
  properties: {col_widths: '{"VUOBAB":40,"QPMBBW":10}', visible: false}
  type: ColumnPanel
  layout_properties: {column: VJQQOR}
  components:
  - name: text_area_comentario
    properties: {role: outlined, height: 90}
    type: TextArea
    layout_properties: {grid_position: 'EJJKCF,VUOBAB'}
    data_bindings:
    - {property: text, code: 'self.item[''comentario'']', writeback: false}
  - name: button_guardar
    properties: {text: '', icon: 'fa:save', role: filled-button, background: 'theme:Green',
      foreground: 'theme:White'}
    type: Button
    layout_properties: {grid_position: 'EJJKCF,QPMBBW FSCCXM,JBQLWB'}
    event_bindings: {click: button_guardar_click}
  - name: button_eliminar
    properties: {text: '', role: filled-button, icon: 'fa:times', background: 'theme:Red'}
    type: Button
    layout_properties: {grid_position: 'EJJKCF,QPMBBW CXFDQA,KGMNNE'}
    event_bindings: {click: button_eliminar_click}
