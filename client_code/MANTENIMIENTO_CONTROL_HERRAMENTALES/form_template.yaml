container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'RIEBTU,GDKATN', full_width_row: true}
  components:
  - name: outlined_card_title
    properties: {role: elevated-card, background: ''}
    type: ColumnPanel
    layout_properties: {grid_position: 'RQHGGM,KYDADT'}
    components:
    - name: label_title
      properties:
        text: |
          CONTROL DE SUAJES
        role: title
        background: theme:Primary
        foreground: theme:On Primary
        bold: true
        align: center
      type: Label
      layout_properties: {grid_position: 'WIPJGU,YWZADD'}
  - name: outlined_card_body
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'WNVMKG,VHSWPG', full_width_row: true}
    components:
    - name: flow_panel_1
      properties: {align: center}
      type: FlowPanel
      layout_properties: {grid_position: 'WZUBPL,IXAESG'}
      components:
      - name: button_nuevo
        properties:
          text: |
            NUEVO SUAJE
          role: filled-button
          icon: fa:file
          bold: true
          align: center
          background: theme:Orange
          foreground: theme:Primary
        type: Button
        layout_properties: {}
        event_bindings: {click: button_nuevo_click}
      - name: button_actualizar
        properties: {text: ACTUALIZAR TABLA, role: filled-button, icon: 'fa:refresh', bold: true, align: center}
        type: Button
        layout_properties: {}
        event_bindings: {click: button_actualizar_click}
    - name: spacer_1
      properties: {height: 17}
      type: Spacer
      layout_properties: {grid_position: 'KBUPBE,PLZOHF'}
    - name: label_3
      properties: {icon: 'fa:check', align: center, bold: true, text: HERRAMENTAL EN CONDICIONES DE OPERACIÓN, background: 'theme:SecondaryGreen'}
      type: Label
      layout_properties: {grid_position: 'ELRTPN,EOOHDN'}
    - name: label_alerta_revision
      properties: {text: HERRAMENTAL PRÓXIMO A REVISIÓN, align: center, bold: true, icon: 'fa:warning', background: 'theme:Yellow'}
      type: Label
      layout_properties: {grid_position: 'ELRTPN,IYHYEZ'}
    - name: label_1
      properties: {icon: 'fa:exclamation-circle', background: 'theme:Red', foreground: 'theme:Yellow', text: HERRAMENTAL ALCANZÓ CICLOS PARA REVISIÓN, bold: true, align: center}
      type: Label
      layout_properties: {grid_position: 'ELRTPN,QTRAEE'}
    - name: data_grid_herramentales
      properties:
        columns:
        - {id: JKSDUP, title: '', data_key: editar, width: '100'}
        - {id: ISLAHB, data_key: localizar, title: '', width: '90'}
        - {id: XTGDJP, data_key: tipo_suaje, title: TIPO DE SUAJE, width: '200'}
        - {id: OJLQEN, title: DESCRIPCIÓN, data_key: descripcion, width: '400', expand: false}
        - {id: IEFKUK, data_key: ubicacion, title: UBICACIÓN, width: '150'}
        - {id: VJQQOR, title: CÓDIGO DE HERRAMENTAL, data_key: codigo_herramental, width: '200', expand: false}
        - {id: XCLKEX, data_key: vida_util, title: VIDA ÚTIL ESTIMADA, width: '200'}
        - {id: JWMLVC, data_key: alerta, title: ALERTA PARA REVISIÓN, width: '200'}
        - {id: WWXEME, data_key: contador, title: CICLOS DE CORTE ACUMULADOS, width: '200'}
        - {id: LJHPYT, data_key: fecha_registros, title: FECHA DE ALTA, width: '200'}
        - {id: NHKBAB, data_key: nombre_usuario, title: OPERADOR, width: '300'}
        role: wide-tonal-data-grid
      type: DataGrid
      components:
      - name: data_row_panel_filtros
        properties: {foreground: '', background: 'theme:Secondary'}
        type: DataRowPanel
        components:
        - name: text_box_codigo_herramental
          properties: {role: outlined, background: 'theme:On Primary'}
          type: TextBox
          layout_properties: {column: VJQQOR}
        - name: text_box_ubicacion
          properties: {role: outlined, background: 'theme:On Primary'}
          type: TextBox
          layout_properties: {column: IEFKUK}
        - name: drop_down_alerta
          properties: {role: outlined, background: 'theme:On Primary'}
          type: DropDown
          layout_properties: {column: JWMLVC}
        layout_properties: {}
      - name: repeating_panel_herramentales
        properties: {item_template: MANTENIMIENTO_CONTROL_HERRAMENTALES.RowTemplateHerramental}
        type: RepeatingPanel
      layout_properties: {grid_position: 'NEXOXL,LERAIR', full_width_row: true}
is_package: true
