container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'BIQIDX,HYBYOQ'}
  components:
  - name: outlined_card_body
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'KZNTOV,YXPWYP'}
    components:
    - name: label_titulo
      properties: {text: PROGRAMACIÓN DE SUAJE, role: title, align: center, bold: true}
      type: Label
      layout_properties: {grid_position: 'MYBAEX,NOPEOI'}
    - name: label_fecha_programada
      properties: {text: 'FECHA PROGRAMADA:', bold: true}
      type: Label
      layout_properties: {grid_position: 'BMZTLK,MTDLOA'}
    - name: date_picker_fecha_programada
      properties: {role: outlined, format: '%d/%m/%Y'}
      type: DatePicker
      layout_properties: {grid_position: 'XAJUYK,PCGCJV'}
      data_bindings:
      - {property: tag, code: '"fecha_programada"', writeback: false}
    - name: label_numero_parte
      properties: {text: 'NÚMERO DE PARTE:', bold: true}
      type: Label
      layout_properties: {grid_position: 'BNOSLV,XMWUTL'}
    - name: drop_down_numeros_parte
      properties: {role: outlined, include_placeholder: true, placeholder: -- SELECCIONE --}
      type: DropDown
      layout_properties: {grid_position: 'XBNBYZ,LROIGW'}
      data_bindings:
      - {property: tag, code: '"id_numero_parte"', writeback: false}
      event_bindings: {change: drop_down_numeros_parte_change}
    - name: label_tipo_suaje
      properties: {text: 'TIPO DE SUAJE:', bold: true}
      type: Label
      layout_properties: {grid_position: 'ASNMUD,CIHRRE'}
    - name: drop_down_tipo_suaje
      properties: {role: outlined, enabled: false, include_placeholder: true, placeholder: -- SELECCIONE --}
      type: DropDown
      layout_properties: {grid_position: 'KFPRPN,HINDLR'}
      data_bindings:
      - {property: tag, code: '"tipo_suaje"', writeback: false}
      event_bindings: {}
    - name: label_suajes_programados
      properties: {text: 'SUAJES PROGRAMADOS:', bold: true}
      type: Label
      layout_properties: {grid_position: 'UOKLNV,WRGQFC'}
    - name: text_box_suajes_programados
      properties: {type: number, role: outlined}
      type: TextBox
      layout_properties: {grid_position: 'KBVVXK,OCUDXN'}
      data_bindings:
      - {property: tag, code: '"suajes_programados"', writeback: false}
    - name: button_guardar
      properties: {text: GUARDAR, role: filled-button, icon: 'fa:save', bold: true}
      type: Button
      layout_properties: {grid_position: 'JKSGPX,CMTCZV'}
      event_bindings: {click: button_guardar_click}
is_package: true
