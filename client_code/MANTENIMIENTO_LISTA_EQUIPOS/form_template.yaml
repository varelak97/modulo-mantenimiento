container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'YEBQKU,YRZNNA'}
  components:
  - name: outlined_card_title
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'ASKKYO,BCQQDD'}
    components:
    - name: label_titulo
      properties: {text: LISTADO GENERAL DE EQUIPOS, align: center, bold: true, role: title,
        background: 'theme:Primary', foreground: 'theme:White'}
      type: Label
      layout_properties: {grid_position: 'BGTUTL,ICWXAW'}
  - name: outlined_card_filtros
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'DIGXGU,TLLETO'}
    components:
    - name: label_area
      properties: {text: 'AREA:', bold: true}
      type: Label
      layout_properties: {grid_position: 'BYEIUP,OBMHLL LLCYSU,EUFMSA'}
    - name: drop_down_area
      properties: {role: outlined, include_placeholder: true, placeholder: -- AREA --}
      type: DropDown
      layout_properties: {grid_position: 'BYEIUP,OBMHLL YQYWEE,SLNJSE'}
      event_bindings: {change: drop_down_area_change}
    - name: label_equipo
      properties: {text: 'EQUIPO:', bold: true}
      type: Label
      layout_properties: {grid_position: 'BYEIUP,OBMHLL CAXHCI,IVYFYN'}
    - name: drop_down_equipo
      properties: {role: outlined, include_placeholder: true, placeholder: -- EQUIPO --}
      type: DropDown
      layout_properties: {grid_position: 'BYEIUP,OBMHLL KOJEJI,ZKEIQM'}
      event_bindings: {change: drop_down_equipo_change}
    - name: outlined_card_img_equipo
      properties: {role: elevated-card}
      type: ColumnPanel
      layout_properties: {grid_position: 'BYEIUP,HPLOGN'}
      components:
      - name: image_equipo
        properties: {source: _/theme/equipos/default.png, display_mode: shrink_to_fit}
        type: Image
        layout_properties: {grid_position: 'OYEKRJ,GUGRDB'}
        data_bindings: []
    - name: label_tipo_mtto
      properties: {text: 'TIPO DE MANTENIMIENTO:', bold: true, align: center}
      type: Label
      layout_properties: {grid_position: 'AYTBUP,DUPRFA'}
    - name: link_calendario_mttos
      properties: {role: null, visible: true}
      type: Link
      layout_properties: {grid_position: 'TUODEU,QGEHYN'}
      components:
      - name: outlined_card_calendario_mttos
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'OUMSPT,TFNMKP'}
        components:
        - name: image_calendario_mttos
          properties: {source: _/theme/iconos/calendario_anual.png, height: '100'}
          type: Image
          layout_properties: {grid_position: 'YTZQGB,FZGRNH'}
        - name: label_calendario_mttos
          properties: {text: CALENDARIO ANUAL DE MANTENIMIENTOS, bold: true, align: center}
          type: Label
          layout_properties: {grid_position: 'PIOVLG,UOKKGE'}
      event_bindings: {click: link_calendario_mttos_click}
      data_bindings: []
    - name: link_mtto_preventivo_correctivo
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,KSGOCH'}
      components:
      - name: outlined_card_mtto_preventivo_correctivo
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'IIEWAV,GGWONO'}
        components:
        - name: image_mtto_preventivo_correctivo
          properties: {source: _/theme/iconos/mtto_preventivo_correctivo_prog.png,
            height: 100}
          type: Image
          layout_properties: {grid_position: 'GELVWU,FVUQRY'}
        - name: label_mtto_preventivo_correctivo
          properties: {text: MANTENIMIENTO PREVENTIVO/CORRECTIVO, bold: true, align: center}
          type: Label
          layout_properties: {grid_position: 'ZHWNCC,CEIBQR'}
      event_bindings: {click: link_mtto_preventivo_correctivo_click}
    - name: link_solicitudes_mtto
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,ACSBOA'}
      components:
      - name: outlined_card_solicitudes_mtto
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'VCSTKT,SLYQJM'}
        components:
        - name: image_solicitudes_mtto
          properties: {source: _/theme/iconos/solicitudes_mtto.png, height: '100'}
          type: Image
          layout_properties: {grid_position: 'BFWXHA,FNARLB'}
        - name: label_solicitudes_mtto
          properties: {text: SOLICITUDES DE MANTENIMIENTO, bold: true, align: center}
          type: Label
          layout_properties: {grid_position: 'FXVIML,KCAEXH'}
      event_bindings: {click: link_solicitudes_mtto_click}
    - name: link_mtto_autonomo
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,XAIAWO'}
      components:
      - name: outlined_card_mtto_autonomo
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'QNFXUT,TQOFCG'}
        components:
        - name: image_mtto_autonomo
          properties: {height: '100', source: _/theme/iconos/mtto_autonomo.png}
          type: Image
          layout_properties: {grid_position: 'WOVRWL,GKJKNO'}
        - name: label_mtto_autonomo
          properties: {text: MANTENIMIENTO AUTÓNOMO, bold: true, align: center}
          type: Label
          layout_properties: {grid_position: 'WMORHY,OYPKVW'}
      event_bindings: {click: link_mtto_autonomo_click}
is_package: true
