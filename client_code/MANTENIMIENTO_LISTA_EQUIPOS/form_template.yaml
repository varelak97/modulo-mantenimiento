container: {type: ColumnPanel}
components:
- name: content_panel
  properties: {}
  type: ColumnPanel
  layout_properties: {grid_position: 'YEBQKU,YRZNNA'}
  components:
  - name: outlined_card_title
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'ASKKYO,BCQQDD'}
    components:
    - name: label_titulo
      properties: {text: LISTADO DE EQUIPOS, align: center, bold: true, role: title,
        background: 'theme:Primary', foreground: 'theme:White'}
      type: Label
      layout_properties: {grid_position: 'BGTUTL,ICWXAW'}
  - name: outlined_card_filtros
    properties: {role: elevated-card}
    type: ColumnPanel
    layout_properties: {grid_position: 'DIGXGU,TLLETO'}
    components:
    - name: label_area
      properties: {text: 'AREA:', bold: true}
      type: Label
      layout_properties: {grid_position: 'RQBDLC,IEDKFC'}
    - name: label_equipo
      properties: {text: 'EQUIPO:', bold: true}
      type: Label
      layout_properties: {grid_position: 'RQBDLC,ACHXWY'}
    - name: drop_down_area
      properties: {role: outlined, include_placeholder: true, placeholder: -- AREA --}
      type: DropDown
      layout_properties: {grid_position: 'BYEIUP,OBMHLL BLDTME,OEACHC'}
      event_bindings: {change: drop_down_area_change}
    - name: label_tipo_mantenimiento
      properties: {text: 'TIPO DE MANTENIMIENTO:', bold: true}
      type: Label
      layout_properties: {grid_position: 'BYEIUP,OBMHLL LOJDAZ,EKHZMU'}
    - name: drop_down_tipo_mtto
      properties:
        role: outlined
        items: [PREVENTIVO, PREVENTIVO/CORRECTIVO PROGRAMADO, AUTÓNOMO]
        placeholder: -- SELECCIONE MANTENIMIENTO --
        include_placeholder: true
      type: DropDown
      layout_properties: {grid_position: 'BYEIUP,OBMHLL BFWZTR,HLRJJD'}
      data_bindings: []
      event_bindings: {change: drop_down_tipo_mtto_change}
    - name: drop_down_equipo
      properties: {role: outlined, include_placeholder: true, placeholder: -- EQUIPO --}
      type: DropDown
      layout_properties: {grid_position: 'BYEIUP,KXQJIC'}
    - name: link_calendario
      properties: {role: null}
      type: Link
      layout_properties: {grid_position: 'TUODEU,QGEHYN'}
      components:
      - name: outlined_card_calendario_mtto_preventivo
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'OUMSPT,TFNMKP'}
        components:
        - name: image_1
          properties: {source: _/theme/mtto_preventivo.jpg}
          type: Image
          layout_properties: {grid_position: 'YTZQGB,FZGRNH'}
        - name: label_calendario
          properties: {text: CALENDARIO DE MANTENIMIENTOS PREVENTIVOS, bold: true}
          type: Label
          layout_properties: {grid_position: 'VRHEYI,CGRBFS'}
      event_bindings: {click: link_calendario_click}
    - name: link_2
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,KSGOCH'}
      components:
      - name: outlined_card_2
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'IIEWAV,GGWONO'}
        components:
        - name: image_2
          properties: {source: _/theme/mtto_programado.png}
          type: Image
          layout_properties: {grid_position: 'GELVWU,FVUQRY'}
        - name: label_mtto_preventivo_programado
          properties: {text: MANTENIMIENTO PREVENTIVO PROGRAMADO, bold: true}
          type: Label
          layout_properties: {grid_position: 'ZHWNCC,CEIBQR'}
    - name: link_3
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,ACSBOA'}
      components:
      - name: outlined_card_3
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'VCSTKT,SLYQJM'}
        components:
        - name: image_3
          properties: {source: _/theme/mtto_correctivo.png}
          type: Image
          layout_properties: {grid_position: 'BFWXHA,FNARLB'}
        - name: label_mtto_correctivo_programado
          properties: {text: MANTENIMIENTO CORRECTIVO PROGRAMADO, bold: true}
          type: Label
          layout_properties: {grid_position: 'FXVIML,KCAEXH'}
    - name: link_4
      properties: {}
      type: Link
      layout_properties: {grid_position: 'TUODEU,XAIAWO'}
      components:
      - name: outlined_card_4
        properties: {role: elevated-card}
        type: ColumnPanel
        layout_properties: {grid_position: 'QNFXUT,TQOFCG'}
        components:
        - name: image_4
          properties: {}
          type: Image
          layout_properties: {grid_position: 'WOVRWL,GKJKNO'}
        - name: label_mtto_autonomo
          properties: {text: MANTENIMIENTO AUTÓNOMO, bold: true}
          type: Label
          layout_properties: {grid_position: 'WMORHY,OYPKVW'}
  - name: outlined_card_body
    properties: {role: elevated-card, visible: false}
    type: ColumnPanel
    layout_properties: {grid_position: 'MQLZLM,XDFKLY'}
is_package: true
