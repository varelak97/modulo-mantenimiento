is_package: true
container:
  type: HtmlTemplate
  properties: {html: '@theme:standard-page.html', visible: true, role: null}
components:
- type: ColumnPanel
  properties: {col_widths: '{}'}
  name: content_panel
  layout_properties: {slot: default}
  components: []
- type: ColumnPanel
  properties: {col_widths: '{}'}
  name: column_panel_1
  layout_properties: {slot: left-nav}
  components:
  - type: DropDown
    properties:
      role: null
      align: full
      tooltip: ''
      placeholder: -- ELEGIR --
      border: ''
      enabled: true
      foreground: ''
      items: ['']
      visible: false
      font_size: null
      font: ''
      spacing_above: small
      spacing_below: small
      italic: false
      background: ''
      bold: false
      underline: false
      include_placeholder: true
    name: drop_down_menu_areas
    layout_properties: {grid_position: 'IMDWZO,XBUUVL'}
    event_bindings: {change: drop_down_menu_areas_change}
- name: label_usuario
  properties: {role: input-prompt}
  type: Label
  layout_properties: {slot: nav-right}
  data_bindings:
  - {property: text, code: 'f"{self.datos[''nombre_usuario'']} ({self.datos[''id_usuario_erp'']})"', writeback: false}
